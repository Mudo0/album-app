apply plugin: 'com.android.application'

// ── Versión desde package.json ─────────────────────────────────────────────
// La fuente de verdad de la versión es package.json (la maneja scripts/release.js).
// `npx cap sync` NO actualiza versionCode/versionName: verificado en el source
// del CLI (@capacitor/cli/dist/tasks/copy.js) — solo copia assets web. Si no los
// derivamos acá, el APK siempre sale como versión "1.0" / versionCode 1.
def pkgVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def versionMatcher = (pkgVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-([a-z]+)\.(\d+))?$/)
if (!versionMatcher) {
    throw new GradleException("Versión inválida en package.json: ${pkgVersion}")
}
def vMajor = versionMatcher[0][1] as int
def vMinor = versionMatcher[0][2] as int
def vPatch = versionMatcher[0][3] as int
def vStage = versionMatcher[0][4]                    // null si es estable
def vStageNum = versionMatcher[0][5] ? versionMatcher[0][5] as int : 0
// versionCode siempre creciente por release:
//   base X.Y.Z  → X*1000000 + Y*10000 + Z*100
//   etapa       → alpha: 10+N, beta: 20+N, rc: 30+N, estable: 50
//   ej: 0.0.0-alpha.1 → 11, 0.0.0-beta.1 → 21, 0.0.0 → 50, 1.0.0 → 1000050
def vStageCode = vStage == null ? 50 : (['alpha': 10, 'beta': 20, 'rc': 30][vStage] + vStageNum)
def appVersionCode = vMajor * 1000000 + vMinor * 10000 + vPatch * 100 + vStageCode
def appVersionName = pkgVersion

// ── Firma del APK (release) ─────────────────────────────────────────────────
// Carga condicional de android/keystore.properties (gitignoreado):
//   - CI: lo escribe el workflow desde los secrets (KEYSTORE_*)
//   - Local: lo creás vos apuntando a tu keystore.jks
// Si no existe el archivo, release cae al debug signing para que los builds
// locales sigan funcionando sin fricción (la firma debug no sirve para
// distribuir, pero compila).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mudo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mudo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Firma real si hay keystore.properties; si no, debug (build local)
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    // Renombra el APK con la versión (misma regla que el CI):
    //   alpha/beta -> album-app-alpha.1.apk (el X.Y.Z es provisional, no va)
    //   rc/estable -> album-app-v1.0.0.apk   (la versión ya está fijada)
    // El versionName/versionCode se derivan de package.json al inicio de este archivo.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def vn = variant.versionName
            if (vn ==~ /.*-(alpha|beta)\.\d+/) {
                outputFileName = "album-app-${vn.substring(vn.lastIndexOf('-') + 1)}.apk"
            } else {
                outputFileName = "album-app-v${vn}.apk"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // EXIF orientation para GalleryPlugin (fotos de cámara rotadas)
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
