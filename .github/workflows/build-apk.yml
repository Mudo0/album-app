name: Compilar APK Android

on:
  push:
    tags:
      - 'v*' # Solo cuando publiques una versión con un tag (vX.Y.Z[-etapa.N])
  workflow_dispatch: # Manual: compila y testea sin publicar release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Necesario para crear el Release con el APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v6

      # 2. Configurar el entorno de Node.js (mismo major que el local: 24)
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # 3. Configurar Java (requerido para compilar Android).
      #    Capacitor 7+ compila capacitor-android con sourceCompatibility 21,
      #    así que JDK 17 ya no alcanza (error "invalid source release: 21").
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Cache de Gradle (acelera mucho los builds de Android)
      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 5. Instalar dependencias de Node
      - name: Instalar dependencias
        run: npm ci

      # 6. Tests unitarios (vitest + jsdom, como en local)
      - name: Correr tests unitarios
        run: npm test

      # 7. Compilar la app Web en Angular y sincronizar con Capacitor
      - name: Build de Angular y Capacitor Sync
        run: |
          npm run build
          npx cap sync android

      # 8. Dar permisos de ejecución a Gradle
      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      # 9. Configurar la firma: decodifica el keystore desde los secrets y
      #    escribe android/keystore.properties (lo lee build.gradle).
      #    Si el secret no está (p.ej. PR externo), cae a debug signing.
      - name: Configurar firma del APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin keystore en secrets: se usará debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 10. Compilar el APK de Android (Release, firmado con el keystore real)
      - name: Compilar APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      # 11. Detectar el canal del tag: prerelease (alpha/beta/rc) vs estable
      #     (C1). Las expresiones de GH Actions no tienen regex, así que el
      #     check del spec se hace acá y se expone como output.
      - name: Detectar canal del tag
        id: channel
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta|rc)\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # 12. Tomar el APK generado por Gradle. Ya viene con el nombre por versión
      #     (album-app-alpha.1.apk en alpha/beta, album-app-v1.0.0.apk en rc/estable,
      #     definido en android/app/build.gradle con la misma regla).
      #     Se copia también al canónico del canal (C1):
      #       estable    → album-app.apk      (link releases/latest/download/album-app.apk)
      #       prerelease → album-app-dev.apk  (el checker elige este asset en prereleases)
      - name: Preparar APK para el release
        id: apk
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró el APK generado"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta|rc)\. ]]; then
            CANONICAL="album-app-dev.apk"
          else
            CANONICAL="album-app.apk"
          fi
          cp "$APK_PATH" "android/app/build/outputs/apk/release/$CANONICAL"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "canonical_name=${CANONICAL}" >> "$GITHUB_OUTPUT"
          echo "APK final: ${APK_NAME} (canónico: ${CANONICAL})"

      # 13. CHANGELOG REAL (C2): commits entre el release publicado anterior y el
      #     tag actual (gh api compare/<prev>...<head>). El release actual aún
      #     NO existe (se crea en el paso 14) → releases[0] ES el anterior.
      #     Si no hay previo, el diff es vacío o la API falla → body genérico
      #     (no bloquea el release; runbook: editar el body a mano si hace falta).
      - name: Calcular changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="APK para la versión ${{ github.ref_name }}."
          PREV_TAG=$(gh api "/repos/${{ github.repository }}/releases" --jq '.[0].tag_name // empty' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${{ github.ref_name }}" ]; then
            COMMITS=$(gh api "/repos/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" --jq '[.commits[] | "- " + (.commit.message | split("\n")[0])] | join("\n")' 2>/dev/null || true)
            if [ -n "$COMMITS" ]; then
              BODY="$BODY"$'\n\n## Cambios\n'"$COMMITS"
            fi
          fi
          # GH Actions no acepta saltos de línea crudos en outputs: escapar
          BODY="${BODY//'%'/'%25'}"
          BODY="${BODY//$'\n'/'%0A'}"
          BODY="${BODY//$'\r'/'%0D'}"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"

      # 14. Crear el Release con el APK (solo cuando el run viene de un tag v*).
      #     C1: prerelease=true solo en tags prerelease; make_latest=true SOLO
      #     en estables (arregla /releases/latest para links manuales).
      #     Links de descarga en 1 click:
      #       Por versión: https://github.com/<repo>/releases/download/v1.0.0-alpha.1/album-app-alpha.1.apk
      #       Estable:     https://github.com/<repo>/releases/latest/download/album-app.apk
      #       Prerelease:  https://github.com/<repo>/releases/download/vX.Y.Z-alpha.N/album-app-dev.apk
      - name: Crear Release con el APK
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: APK ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            android/app/build/outputs/apk/release/${{ steps.apk.outputs.apk_name }}
            android/app/build/outputs/apk/release/${{ steps.apk.outputs.canonical_name }}
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.is_prerelease == 'false' }}

      # 15. Notificación a Discord (canal #release): taggea al rol de testers + link directo
      #     La URL se construye de forma determinística (repo + tag + nombre del APK),
      #     sin depender del output 'assets' de action-gh-release (puede venir vacío).
      - name: Enviar notificación a Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          APK_PATH: android/app/build/outputs/apk/release/${{ steps.apk.outputs.apk_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          MSG="📢 <@&1536481832680431659> 🚀 **¡Nueva versión ${{ github.ref_name }} lista!**\n\n👀 *Mirá los últimos cambios y notas de esta versión acá:* [Ver Release en GitHub]($RELEASE_URL)\n\n📲 **Descarga rápida:** Podés bajar el APK adjunto directo acá abajo 👇"

          curl -sSf -X POST "$DISCORD_WEBHOOK_RELEASE" \
            -F "file1=@$APK_PATH" \
            -F "payload_json={\"content\": \"$MSG\", \"allowed_mentions\": {\"roles\": [\"1536481832680431659\"]}}"

      # 16. Enviar APK por Telegram (documento adjunto + link directo).
      #     Misma URL determinística que en Discord (sin parsear outputs de terceros).
      - name: Enviar APK por Telegram
        if: startsWith(github.ref, 'refs/tags/')
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🎉 Nuevo APK ${{ github.ref_name }}!
            Repositorio: ${{ github.repository }}
            Descargar:
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.apk.outputs.apk_name }}
          document: android/app/build/outputs/apk/release/${{ steps.apk.outputs.apk_name }}
